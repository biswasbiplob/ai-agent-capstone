name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio ruff mypy

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy feedback_agent/json_utils.py

      - name: Tests
        run: pytest -q
