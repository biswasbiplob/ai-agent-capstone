[project]
name = "ai-agent-capstone"
version = "0.1.0"
description = "AI-powered exam correction system with automated grading, weakness analysis, and personalized learning recommendations using Google Agent Development Kit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.2",
    "google-adk[eval]>=1.19.0",
    "google-genai>=1.52.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["feedback_agent"]
